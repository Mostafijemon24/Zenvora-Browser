  <text x="184" y="170" font-family="Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#24211d" letter-spacing="-2">Zenvora</text>
  <text x="74" y="236" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#5c564e">An AI-first desktop browser with workspaces,</text>
  <text x="74" y="270" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#5c564e">a page assistant and supervised task automation.</text>
