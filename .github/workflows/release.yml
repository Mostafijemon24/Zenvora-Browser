# Builds Zenvora installers on each OS and publishes them to a GitHub Release.
# Runs when a version tag like v0.1.0 is pushed, when the `release` branch is
# pushed (the tag is then made from app/package.json's version), or manually.
name: Release

on:
  push:
    tags: ['v*']
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, flag: --linux }
          - { name: Windows, os: windows-latest, flag: --win }
          - { name: macOS, os: macos-latest, flag: --mac }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    env:
      # No paid signing certificates yet: macOS gets an ad-hoc signature.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.flag }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/release/*.exe
            app/release/*.dmg
            app/release/*.AppImage
            app/release/*.deb
            app/release/latest*.yml

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: installers-*
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum *.exe *.dmg *.AppImage *.deb > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Version
        id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else echo "tag=v$(node -p "require('./app/package.json').version")" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Zenvora ${{ steps.v.outputs.tag }}
          body_path: app/RELEASE_NOTES.md
          files: out/*
